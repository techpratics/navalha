debug: true

spring:
  logging:
    level:
      root: INFO
      org.flywaydb: DEBUG
      org.springframework.boot.autoconfigure.logging: DEBUG
  application:
    name: Backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

api:
  security:
      secret: "${JWT_SECRET:my-secret-key}"