spring:
  application:
    name: Backend
  datasource:
    url: jdbc:h2:mem:navalha
    driver-class-name: org.h2.Driver
    username: sa
    password:

    jpa:
      database-platform: org.hibernate.dialect.H2Dialect
      hibernate:
        ddl-auto: create-drop
      show-sql: true
      properties:
        hibernate:
          format_sql: true

    h2:
      console:
        enabled: true
        path: /h2-console