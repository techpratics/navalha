# Nginx config baked into the Frontend Docker image (infra/nginx -> Frontend/Dockerfile).
# Serves the compiled Vite SPA and proxies /api/ to the backend container.
server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: unknown paths fall back to index.html for React Router.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;

        set $backend http://backend:8080;

        proxy_pass $backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
